name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_DASHBOARD_URL: https://pallavi-khandekar.github.io/Zerodha-App/dashboard
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: ./dashboard
        env:
          CI: false
          PUBLIC_URL: /Zerodha-App/dashboard
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_LANDING_URL: https://pallavi-khandekar.github.io/Zerodha-App
        run: npm run build

      - name: Add dashboard to Pages site
        run: cp -R ./dashboard/build ./frontend/build/dashboard

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
